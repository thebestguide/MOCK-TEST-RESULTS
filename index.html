<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Mock Test Result</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center px-4 py-6 sm:py-10">
  <main class="w-full max-w-md">
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Mock Test Result</h1>
      <p class="text-xs text-slate-500 mt-1 leading-relaxed" id="sheetTitle"></p>
      <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wider mt-0.5" id="sheetSubtitle"></p>
    </header>

    <!-- Search Box -->
    <section class="relative mb-5" aria-label="Student Name Search">
      <label for="nameInput" class="block text-xs font-medium text-slate-600 mb-1.5">
        Enter Student Name
      </label>
      <div class="relative">
        <input
          id="nameInput"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="Type your name (e.g. P...)"
          aria-autocomplete="list"
          aria-controls="suggestionsList"
          aria-expanded="false"
          class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3.5 pr-10 text-base text-slate-900 placeholder-slate-400 shadow-sm focus:border-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900/10 transition"
        />
        <button
          id="clearBtn"
          type="button"
          aria-label="Clear search"
          class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 h-8 w-8 rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700 flex items-center justify-center text-lg leading-none"
        >
          &times;
        </button>
      </div>

      <!-- Autocomplete Recommendations -->
      <ul
        id="suggestionsList"
        role="listbox"
        class="hidden absolute left-0 right-0 z-20 mt-1.5 max-h-72 overflow-y-auto rounded-xl border border-slate-200 bg-white shadow-lg divide-y divide-slate-100"
      ></ul>
    </section>

    <!-- Empty / No Match Hint -->
    <div id="emptyState" class="hidden rounded-xl border border-dashed border-slate-300 bg-white/70 p-6 text-center text-sm text-slate-500">
      No student found matching "<span id="emptyQuery" class="font-medium text-slate-700"></span>".
    </div>

    <!-- Result Card -->
    <section id="resultCard" class="hidden rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden" aria-live="polite">
      <!-- Student Identity -->
      <div class="border-b border-slate-100 bg-slate-50/70 px-4 py-4">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-[11px] font-medium uppercase tracking-wider text-slate-400">Students Name</p>
            <h2 id="resName" class="text-lg font-bold text-slate-900 break-words mt-0.5"></h2>
          </div>
          <span id="resSerial" class="shrink-0 rounded-lg bg-slate-900 px-2.5 py-1 text-xs font-semibold text-white"></span>
        </div>

        <dl class="mt-3 grid grid-cols-2 gap-x-3 gap-y-2 text-xs">
          <div>
            <dt class="text-slate-400">Code No.</dt>
            <dd id="resCode" class="font-medium text-slate-800 break-all"></dd>
          </div>
          <div>
            <dt class="text-slate-400">Medium</dt>
            <dd id="resMedium" class="font-medium text-slate-800"></dd>
          </div>
          <div class="col-span-2">
            <dt class="text-slate-400">School Name</dt>
            <dd id="resSchool" class="font-medium text-slate-800 break-words"></dd>
          </div>
          <div>
            <dt class="text-slate-400">Centre</dt>
            <dd id="resCentre" class="font-medium text-slate-800"></dd>
          </div>
          <div>
            <dt class="text-slate-400">Contact No</dt>
            <dd id="resContact" class="font-medium text-slate-800"></dd>
          </div>
        </dl>
      </div>

      <!-- Subject Marks -->
      <div class="px-4 py-4">
        <p class="text-[11px] font-medium uppercase tracking-wider text-slate-400 mb-2.5">Subject Marks</p>
        <div id="marksGrid" class="grid grid-cols-2 gap-2.5"></div>
      </div>

      <!-- Total & Percentage -->
      <div class="border-t border-slate-100 bg-slate-50/70 px-4 py-3.5 grid grid-cols-2 gap-3">
        <div class="rounded-xl bg-white border border-slate-200 px-3 py-2.5">
          <p class="text-[11px] text-slate-400">Total</p>
          <p id="resTotal" class="text-lg font-bold text-slate-900 mt-0.5"></p>
        </div>
        <div class="rounded-xl bg-white border border-slate-200 px-3 py-2.5">
          <p class="text-[11px] text-slate-400">Percentage(%)</p>
          <p id="resPct" class="text-sm font-bold text-slate-900 mt-1 break-all"></p>
        </div>
      </div>
    </section>

    <div id="resetWrap" class="hidden mt-4 text-center">
      <button
        id="resetBtn"
        type="button"
        class="text-xs font-medium text-slate-500 hover:text-slate-900 underline underline-offset-4 py-2 px-3"
      >
        Search another student
      </button>
    </div>
  </main>

    const clearBtn = document.getElementById('clearBtn');
    const suggestionsList = document.getElementById('suggestionsList');
    const emptyState = document.getElementById('emptyState');
    const emptyQuery = document.getElementById('emptyQuery');
    const resultCard = document.getElementById('resultCard');
    const resetWrap = document.getElementById('resetWrap');
    const resetBtn = document.getElementById('resetBtn');

    sheetTitleEl.textContent = EXCEL_DATA.title;
    sheetSubtitleEl.textContent = EXCEL_DATA.subtitle;

    let activeIndex = -1;
    let currentMatches = [];

    function rawStr(val) {
      return val === null || val === undefined ? '' : String(val);
    }

    function getMatches(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const startsWith = [];
      const contains = [];
      for (const row of students) {
        const name = rawStr(row[2]);
        const lower = name.toLowerCase();
        if (lower.startsWith(q)) {
          startsWith.push(row);
        } else if (lower.includes(q)) {
          contains.push(row);
        }
      }
      return startsWith.concat(contains);
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function highlightMatch(name, query) {
      const q = query.trim();
      if (!q) return escapeHtml(name);
      const idx = name.toLowerCase().indexOf(q.toLowerCase());
      if (idx === -1) return escapeHtml(name);
      const before = escapeHtml(name.slice(0, idx));
      const match = escapeHtml(name.slice(idx, idx + q.length));
      const after = escapeHtml(name.slice(idx + q.length));
      return `${before}<mark class="bg-amber-100 text-slate-900 rounded px-0.5 font-semibold">${match}</mark>${after}`;
    }

    function renderSuggestions(matches, query) {
      currentMatches = matches;
      activeIndex = -1;
      suggestionsList.innerHTML = '';

      if (!query.trim()) {
        suggestionsList.classList.add('hidden');
        nameInput.setAttribute('aria-expanded', 'false');
        emptyState.classList.add('hidden');
        return;
      }

      if (matches.length === 0) {
        suggestionsList.classList.add('hidden');
        nameInput.setAttribute('aria-expanded', 'false');
        emptyQuery.textContent = query.trim();
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      matches.forEach((row, idx) => {
        const li = document.createElement('li');
        li.setAttribute('role', 'option');
        li.setAttribute('aria-selected', 'false');
        li.dataset.index = String(idx);
        li.className = 'px-4 py-3 cursor-pointer hover:bg-slate-50 active:bg-slate-100 transition flex items-center justify-between gap-2 min-h-[48px]';
        li.innerHTML = `
          <div class="min-w-0">
            <div class="text-sm font-medium text-slate-900 truncate">${highlightMatch(rawStr(row[2]), query)}</div>
            <div class="text-[11px] text-slate-400 truncate">${escapeHtml(rawStr(row[4]))}</div>
          </div>
          <span class="shrink-0 text-[11px] font-mono text-slate-500">${escapeHtml(rawStr(row[1]))}</span>
        `;
        li.addEventListener('mousedown', (e) => {
          e.preventDefault();
          selectStudent(row);
        });
        suggestionsList.appendChild(li);
      });

      suggestionsList.classList.remove('hidden');
      nameInput.setAttribute('aria-expanded', 'true');
    }

    function updateActiveHighlight() {
      const items = suggestionsList.querySelectorAll('li');
      items.forEach((item, idx) => {
        if (idx === activeIndex) {
          item.classList.add('bg-slate-100');
          item.setAttribute('aria-selected', 'true');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('bg-slate-100');
          item.setAttribute('aria-selected', 'false');
        }
      });
    }

    function selectStudent(row) {
      nameInput.value = rawStr(row[2]);
      clearBtn.classList.remove('hidden');
      suggestionsList.classList.add('hidden');
      nameInput.setAttribute('aria-expanded', 'false');
      emptyState.classList.add('hidden');

      document.getElementById('resSerial').textContent = `#${rawStr(row[0])}`;
      document.getElementById('resCode').textContent = rawStr(row[1]);
      document.getElementById('resName').textContent = rawStr(row[2]);
      document.getElementById('resCentre').textContent = rawStr(row[3]);
      document.getElementById('resSchool').textContent = rawStr(row[4]);
      document.getElementById('resContact').textContent = rawStr(row[5]);
      document.getElementById('resMedium').textContent = rawStr(row[6]);

      const marksGrid = document.getElementById('marksGrid');
      marksGrid.innerHTML = '';
      for (let c = 7; c <= 13; c++) {
        const label = headers[c];
        const val = rawStr(row[c]);
        const isAbsent = val.trim().toUpperCase() === 'AB';
        const card = document.createElement('div');
        card.className = 'rounded-xl border border-slate-200 px-3 py-2.5 flex items-center justify-between gap-2 bg-white';
        card.innerHTML = `
          <span class="text-xs text-slate-500">${escapeHtml(label)}</span>
          <span class="text-sm font-semibold ${isAbsent ? 'text-rose-600' : 'text-slate-900'}">${escapeHtml(val)}</span>
        `;
        marksGrid.appendChild(card);
      }

      document.getElementById('resTotal').textContent = rawStr(row[14]);
      document.getElementById('resPct').textContent = rawStr(row[15]);

      resultCard.classList.remove('hidden');
      resetWrap.classList.remove('hidden');
      nameInput.blur();
    }

    function resetSearch() {
      nameInput.value = '';
      clearBtn.classList.add('hidden');
      suggestionsList.classList.add('hidden');
      nameInput.setAttribute('aria-expanded', 'false');
      emptyState.classList.add('hidden');
      resultCard.classList.add('hidden');
      resetWrap.classList.add('hidden');
      nameInput.focus();
    }

    nameInput.addEventListener('input', () => {
      const val = nameInput.value;
      if (val.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
        resultCard.classList.add('hidden');
        resetWrap.classList.add('hidden');
      }
      const matches = getMatches(val);
      renderSuggestions(matches, val);
    });

    nameInput.addEventListener('keydown', (e) => {
      if (suggestionsList.classList.contains('hidden')) {
        if (e.key === 'Enter' && currentMatches.length === 1) {
          e.preventDefault();
          selectStudent(currentMatches[0]);
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = (activeIndex + 1) % currentMatches.length;
        updateActiveHighlight();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = (activeIndex - 1 + currentMatches.length) % currentMatches.length;
        updateActiveHighlight();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIndex >= 0 && currentMatches[activeIndex]) {
          selectStudent(currentMatches[activeIndex]);
        } else if (currentMatches.length > 0) {
          selectStudent(currentMatches[0]);
        }
      } else if (e.key === 'Escape') {
        suggestionsList.classList.add('hidden');
        nameInput.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('click', (e) => {
      if (!nameInput.contains(e.target) && !suggestionsList.contains(e.target)) {
        suggestionsList.classList.add('hidden');
        nameInput.setAttribute('aria-expanded', 'false');
      }
    });

    clearBtn.addEventListener('click', resetSearch);
    resetBtn.addEventListener('click', resetSearch);
  </script>
</body>
</html>
